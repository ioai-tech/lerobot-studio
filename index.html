    <title>LeRobot Visualizer - LeRobot Studio</title>
    <style>
      #lerobot-root {
        width: 100%;
        height: 100vh;
      }

      #app-boot {
        position: fixed;
        inset: 0;
        background: Canvas;
        color-scheme: light dark;
        z-index: 9999;
      }

      #app-boot .bar {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: min(220px, calc(100vw - 64px));
        height: 3px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.08);
        overflow: hidden;
      }
      #app-boot .bar > div {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #34d399);
        transition: width 160ms ease;
      }

      @media (prefers-color-scheme: dark) {
        #app-boot .bar {
          background: rgba(255, 255, 255, 0.14);
        }
      }
    </style>
  </head>
  <body style="margin: 0; padding: 0">
    <div id="app-boot" aria-label="Loading app">
      <div class="bar" aria-hidden="true"><div id="app-boot-bar"></div></div>
    </div>
    <div id="lerobot-root"></div>
    <script>
      (function () {
        var bar = document.getElementById('app-boot-bar');
        var bootEl = document.getElementById('app-boot');
        if (!bar || !bootEl) return;

        var p = 0;
        var done = false;
        var start = performance.now();

        function set(v) {
          var vv = Math.max(0, Math.min(100, v));
          bar.style.width = vv.toFixed(1) + '%';
        }

        function tick() {
          if (done) return;
          var elapsed = performance.now() - start;
          var target = elapsed < 1200 ? 60 : 90;
          p = p + (target - p) * 0.06 + 0.25;
          if (p > 90) p = 90;
          set(p);
          requestAnimationFrame(tick);
        }
        tick();

        window.__APP_LOADER_DONE__ = function () {
          if (done) return;
          done = true;
          set(100);
          requestAnimationFrame(function () {
            bootEl.style.transition = 'opacity 260ms ease';
            bootEl.style.opacity = '0';
            setTimeout(function () {
              try {
                bootEl.remove();
              } catch (e) {}
            }, 280);
          });
        };
      })();
    </script>
    <script type="module" src="/src/web/main.tsx"></script>
  </body>
