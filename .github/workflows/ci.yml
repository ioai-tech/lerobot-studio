name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install
        run: npm ci
      - name: Generate test fixtures
        run: npm run fixtures:generate
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests with coverage
        run: npm run test:coverage
      - name: Build library
        run: npm run build:lib
      - name: Verify npm consumer typecheck
        run: npm run verify:npm-consumer
      - name: Build web app
        run: npm run build

  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Generate test fixtures
        run: npm run fixtures:generate
      - run: npm run test:browser

  official-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: huggingface/lerobot
          ref: adccdea1cfbec83ed98263feb7e59f7d047c5692
          path: official-lerobot
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - uses: astral-sh/setup-uv@v6
      - run: npm ci
      - name: Generate test fixtures
        run: npm run fixtures:generate
      - name: Install official LeRobot dataset reader
        working-directory: official-lerobot
        run: uv sync --extra dataset
      - name: Verify official LeRobot compatibility
        env:
          LEROBOT_PYTHON: ${{ github.workspace }}/official-lerobot/.venv/bin/python
        run: npm run test:compat
